<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#02070e">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">

    <title>پیدا نشد · SKY</title>

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">

    <style>

        .nf {

            position: relative;

            z-index: 2;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 18px;

            padding: var(--pad);

            text-align: center;
        }

        .nf-gem {

            font-size: clamp(3.4rem, 17vw, 6rem);

            line-height: 1;

            filter: drop-shadow(0 0 44px rgb(31 169 255 / .75));

            animation: nfFloat 6s ease-in-out infinite;
        }

        @keyframes nfFloat {

            50% {
                transform: translateY(-14px) rotate(6deg);
            }
        }

        .nf-code {

            font-family: var(--f-display);

            font-size: clamp(3.6rem, 20vw, 7rem);

            font-weight: 650;

            line-height: 1;

            letter-spacing: .1em;

            direction: ltr;

            background:
                linear-gradient(
                    100deg,
                    var(--ice),
                    var(--cyan) 38%,
                    var(--blue)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 0 30px rgb(31 169 255 / .45));
        }

        .nf h1 {

            font-family: var(--f-display);

            font-size: clamp(1.25rem, 6vw, 1.85rem);

            font-weight: 480;

            line-height: 1.6;

            max-width: 22ch;
        }

        .nf p {

            max-width: 34ch;

            font-size: .95rem;
        }

        .nf a.back {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            height: 48px;

            margin-top: 12px;

            padding-inline: 22px;

            border-radius: 999px;

            font-size: .82rem;

            font-weight: 550;

            color: #04121f;

            background:
                linear-gradient(120deg, var(--ice), var(--cyan) 42%, var(--blue));

            box-shadow:
                0 12px 34px rgb(11 134 255 / .38),
                inset 0 1px 0 rgb(255 255 255 / .5);

            transition: transform .3s var(--ease);
        }

        .nf a.back:active {
            transform: scale(.95);
        }

        .nf-rule {

            width: min(300px, 60vw);
            height: 1px;

            margin-block: 6px;

            background:
                linear-gradient(90deg, transparent, var(--cyan), transparent);

            box-shadow: 0 0 18px rgb(79 220 255 / .6);
        }

    </style>

</head>


<body>

    <div class="backdrop" aria-hidden="true">

        <div class="bd bd-aurora">
            <span class="au au-1"></span>
            <span class="au au-2"></span>
        </div>

        <div class="bd bd-stars"></div>
        <div class="bd bd-grid"><i></i></div>
        <div class="bd bd-vignette"></div>

    </div>


    <main class="nf">

        <span class="nf-gem" aria-hidden="true">💎</span>

        <span class="nf-code">۴۰۴</span>

        <h1>این صفحه اینجا نیست</h1>

        <div class="nf-rule" aria-hidden="true"></div>

        <p>
            ولی الماس سر جاشه.
        </p>

        <a class="back" href="./">
            <span>برگرد به خونه</span>

            <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
            >
                <path
                    d="M12 4 V20 M6 14 L12 20 L18 14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </a>

    </main>

</body>

</html>
